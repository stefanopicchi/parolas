<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7fd" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Parolas" />
    <script>
      // Applica tema e palette prima del primo disegno, evitando il lampo bianco.
      (function () {
        try {
          var raw =
            window.localStorage.getItem('parolas:state:v1') ||
            window.localStorage.getItem('lingua:state:v1')
          var state = raw ? JSON.parse(raw) : null
          var settings = state && state.settings ? state.settings : {}
          var theme = settings.theme
          if (theme !== 'light' && theme !== 'dark') {
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          }
          var palette =
            settings.palette === 'corallo' ||
            settings.palette === 'verde' ||
            settings.palette === 'oceano'
              ? settings.palette
              : 'viola'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.setAttribute('data-palette', palette)
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
          document.documentElement.setAttribute('data-palette', 'viola')
        }
      })()
    </script>
    <meta
      name="description"
      content="Parolas: lezioni, grammatica, vocabolario e ripasso per imparare una lingua. Funziona offline, senza gamification."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <title>Parolas — impara le lingue</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
